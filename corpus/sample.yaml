name: sample-corpus
description: Sample benchmark corpus for testing Claude configurations
version: "1.0.0"

issues:
  # Easy Go issue
  - id: easy-go-nil-check-001
    title: Add nil check to prevent panic
    description: |
      The function `ProcessUser` panics when given a nil user.
      Add a nil check at the start of the function.
    difficulty: easy
    task_type: bug_fix
    language: go
    repo_url: https://github.com/example/sample-go-app
    repo_ref: main
    prompt: |
      Fix the nil pointer panic in cmd/server/handlers.go.
      The ProcessUser function should return an error instead of panicking
      when given a nil user.
    eval_method: test_suite
    test_command: go test ./...
    expected_files:
      - cmd/server/handlers.go
    tags:
      - go
      - error-handling
      - beginner

  # Medium TypeScript issue
  - id: medium-ts-rate-limit-001
    title: Implement rate limiting middleware
    description: |
      Add rate limiting to the Express API to prevent abuse.
      Should limit to 100 requests per minute per IP.
    difficulty: medium
    task_type: feature
    language: typescript
    repo_url: https://github.com/example/sample-express-api
    repo_ref: main
    prompt: |
      Implement rate limiting middleware for the Express API.
      Requirements:
      - Limit to 100 requests per minute per IP address
      - Return 429 status when limit exceeded
      - Add appropriate headers (X-RateLimit-Limit, X-RateLimit-Remaining)
    eval_method: hybrid
    test_command: npm test
    success_criteria: |
      - Rate limiting middleware is implemented
      - Uses IP address as the key
      - Returns 429 with appropriate message when exceeded
      - Includes rate limit headers in responses
    expected_files:
      - src/middleware/rateLimit.ts
      - src/app.ts
    tags:
      - typescript
      - express
      - security

  # Hard Python issue
  - id: hard-py-race-condition-001
    title: Fix race condition in async cache
    description: |
      The async cache implementation has a race condition where
      multiple requests can trigger redundant expensive computations.
    difficulty: hard
    task_type: bug_fix
    language: python
    repo_url: https://github.com/example/sample-python-cache
    repo_ref: main
    prompt: |
      Fix the race condition in src/cache.py.
      The current implementation allows multiple concurrent requests
      for the same key to all trigger the expensive computation.

      Implement proper locking so that only one computation runs
      per key, and other waiters receive the cached result.
    eval_method: llm_judge
    success_criteria: |
      - Uses asyncio locks or similar synchronization primitive
      - Only one computation runs per unique key at a time
      - Waiters receive the result without re-computing
      - No deadlock scenarios introduced
    expected_files:
      - src/cache.py
    tags:
      - python
      - async
      - concurrency
      - advanced
